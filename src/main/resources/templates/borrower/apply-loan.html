<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Apply for Loan - LoanTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Apply for a Personal Loan</h4>
                    </div>
                    <div class="card-body p-4">

                        <form th:action="@{/borrower/apply}" th:object="${applicationDTO}" method="post"
                            enctype="multipart/form-data">

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Loan Amount Requested (₹)</label>
                                    <input type="number" th:field="*{loanAmount}" class="form-control"
                                        placeholder="e.g., 500000" required>
                                    <span class="text-danger small" th:if="${#fields.hasErrors('loanAmount')}"
                                        th:errors="*{loanAmount}"></span>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Loan Purpose</label>
                                    <select th:field="*{loanPurpose}" class="form-select" required>
                                        <option value="" disabled selected>Select Purpose</option>
                                        <option value="PERSONAL">Personal</option>
                                        <option value="HOME">Home</option>
                                        <option value="MEDICAL">Medical</option>
                                        <option value="EDUCATION">Education</option>
                                        <option value="VEHICLE">Vehicle</option>
                                    </select>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label class="form-label">Tenure (Months)</label>
                                    <select th:field="*{tenureMonths}" class="form-select" required>
                                        <option value="6">6 Months</option>
                                        <option value="12">12 Months</option>
                                        <option value="24">24 Months</option>
                                        <option value="36">36 Months</option>
                                        <option value="48">48 Months</option>
                                        <option value="60">60 Months</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Employment Type</label>
                                    <select th:field="*{employmentType}" class="form-select" required>
                                        <option value="" disabled selected>Select Type</option>
                                        <option value="SALARIED">Salaried</option>
                                        <option value="SELF_EMPLOYED">Self-Employed</option>
                                        <option value="BUSINESS">Business</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Monthly Income (₹)</label>
                                    <input type="number" th:field="*{monthlyIncome}" class="form-control"
                                        placeholder="Min ₹15,000" required>
                                    <span class="text-danger small" th:if="${#fields.hasErrors('monthlyIncome')}"
                                        th:errors="*{monthlyIncome}"></span>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Upload Aadhaar Card (PDF/JPG)</label>
                                    <input type="file" name="aadhaarFile" class="form-control" accept=".pdf,.jpg,.jpeg"
                                        required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Upload PAN Card (PDF/JPG)</label>
                                    <input type="file" name="panFile" class="form-control" accept=".pdf,.jpg,.jpeg"
                                        required>
                                </div>
                            </div>
                            <hr class="my-4">
                            <button type="submit" class="btn btn-primary w-100 py-2">Submit Application</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
