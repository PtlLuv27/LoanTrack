<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Credit Score - LoanTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📈 My Credit Profile</h2>
        <a th:href="@{/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
    </div>

    <div class="row">
        <div class="col-md-5">
            <div class="card shadow-sm mb-4">
                <div class="card-body text-center p-4">
                    <h5 class="text-muted mb-3">Current Experian Score</h5>
                    <div style="position: relative; height: 250px; width: 100%;">
                        <canvas id="scoreGauge"></canvas>
                        <div style="position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);">
                            <h1 class="display-4 fw-bold mb-0" th:text="${currentScore}"></h1>
                            <span class="text-muted" id="scoreRating"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">Score Impact History</div>
                <div class="card-body p-0">
                    <table class="table table-striped mb-0">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Reason</th>
                                <th>Impact</th>
                                <th>New Score</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="entry : ${history}">
                                <td th:text="${#temporals.format(entry.recordedAt, 'dd MMM yyyy')}"></td>
                                <td th:text="${entry.changeReason}"></td>
                                <td>
                                    <span th:if="${entry.changeAmount > 0}" class="text-success fw-bold" th:text="'+' + ${entry.changeAmount}"></span>
                                    <span th:if="${entry.changeAmount < 0}" class="text-danger fw-bold" th:text="${entry.changeAmount}"></span>
                                    <span th:if="${entry.changeAmount == 0}" class="text-muted fw-bold">--</span>
                                </td>
                                <td class="fw-bold" th:text="${entry.scoreValue}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(history)}">
                                <td colspan="4" class="text-center py-3">No credit history available yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const score = /*[[${currentScore}]]*/ 650;
    
    // Determine rating text
    let ratingText = "POOR";
    let scoreColor = "#dc3545"; // Red
    if (score >= 750) { ratingText = "EXCELLENT"; scoreColor = "#198754"; } // Green
    else if (score >= 650) { ratingText = "GOOD"; scoreColor = "#0dcaf0"; } // Blue
    else if (score >= 550) { ratingText = "FAIR"; scoreColor = "#ffc107"; } // Yellow
    
    document.getElementById('scoreRating').innerText = ratingText;
    document.getElementById('scoreRating').style.color = scoreColor;
    document.getElementById('scoreRating').style.fontWeight = "bold";

    // Build the Gauge (Doughnut Chart cut in half)
    const ctx = document.getElementById('scoreGauge').getContext('2d');
    new Chart(ctx, {
        type: 'doughnut',
        data: {
            datasets: [{
                data: [score - 300, 900 - score], // Base is 300, Max is 900
                backgroundColor: [scoreColor, '#e9ecef'],
                borderWidth: 0,
                circumference: 180, // Cut in half
                rotation: 270 // Start from the left
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '80%',
            plugins: { tooltip: { enabled: false }, legend: { display: false } }
        }
    });
</script>
</body>
</html>
