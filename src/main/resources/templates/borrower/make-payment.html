<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Secure Checkout - LoanTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h4 class="mb-0">💳 Secure Payment Gateway</h4>
                </div>
                <div class="card-body p-4">
                    
                    <div class="alert alert-info">
                        <strong>Loan ID:</strong> <span th:text="${emi.loan.loanId}"></span> <br>
                        <strong>EMI Month:</strong> <span th:text="${emi.emiNumber}"></span> <br>
                        <strong>Due Date:</strong> <span th:text="${emi.dueDate}"></span>
                    </div>

                    <ul class="list-group mb-4">
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            Base EMI Amount
                            <span th:text="'₹' + ${emi.emiAmount}"></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center text-danger">
                            Late Penalties
                            <span th:text="'₹' + ${emi.penaltyAmount}"></span>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center bg-light fw-bold fs-5">
                            Total Payable
                            <span class="text-primary" th:text="'₹' + ${totalPayable}"></span>
                        </li>
                    </ul>

                    <form th:action="@{/borrower/pay/{id}(id=${emi.emiId})}" method="post">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Select Payment Method</label>
                            <select name="paymentMode" class="form-select form-select-lg" required>
                                <option value="" disabled selected>Choose a method...</option>
                                <option value="UPI">UPI (GPay / PhonePe)</option>
                                <option value="CARD">Credit / Debit Card</option>
                                <option value="NEFT">Bank Transfer (NEFT)</option>
                                <option value="IMPS">Instant Bank Transfer (IMPS)</option>
                            </select>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">Pay ₹<span th:text="${totalPayable}"></span></button>
                            <a th:href="@{/borrower/loan/{id}/schedule(id=${emi.loan.loanId})}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                    
                </div>
                <div class="card-footer text-center text-muted small bg-white">
                    🔒 Protected by 256-bit bank-grade encryption
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
