<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>EMI Schedule - LoanTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📊 Amortization Schedule (Loan #<span th:text="${loan.loanId}"></span>)</h2>
        <div>
            <a th:href="@{/borrower/loan/{id}/statement/pdf(id=${loan.loanId})}" class="btn btn-danger me-2">📄 Download PDF</a>
            <a th:href="@{/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card bg-primary text-white text-center shadow-sm">
                <div class="card-body">
                    <h6>Total Loan Amount</h6>
                    <h4>₹<span th:text="${#numbers.formatDecimal(loan.principalAmount, 1, 'COMMA', 2, 'POINT')}"></span></h4>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-info text-white text-center shadow-sm">
                <div class="card-body">
                    <h6>Monthly EMI</h6>
                    <h4>₹<span th:text="${#numbers.formatDecimal(loan.emiAmount, 1, 'COMMA', 2, 'POINT')}"></span></h4>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-warning text-dark text-center shadow-sm">
                <div class="card-body">
                    <h6>Outstanding Balance</h6>
                    <h4>₹<span th:text="${#numbers.formatDecimal(loan.outstandingBalance, 1, 'COMMA', 2, 'POINT')}"></span></h4>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-success text-white text-center shadow-sm">
                <div class="card-body">
                    <h6>Total Paid</h6>
                    <h4>₹<span th:text="${#numbers.formatDecimal(loan.totalPaid, 1, 'COMMA', 2, 'POINT')}"></span></h4>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Month</th>
                        <th>Due Date</th>
                        <th>EMI Amount</th>
                        <th>Principal Split</th>
                        <th>Interest Split</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="emi : ${schedule}">
                        <td th:text="${emi.emiNumber}"></td>
                        <td th:text="${emi.dueDate}"></td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(emi.emiAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td class="text-success" th:text="'₹' + ${#numbers.formatDecimal(emi.principalComponent, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td class="text-danger" th:text="'₹' + ${#numbers.formatDecimal(emi.interestComponent, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td>
                            <span th:if="${emi.paymentStatus.name() == 'UPCOMING'}" class="badge bg-secondary">Upcoming</span>
                            <span th:if="${emi.paymentStatus.name() == 'PAID'}" class="badge bg-success">Paid</span>
                            <span th:if="${emi.paymentStatus.name() == 'LATE'}" class="badge bg-warning text-dark">Late</span>
                            <span th:if="${emi.paymentStatus.name() == 'MISSED'}" class="badge bg-danger">Missed</span>
                        </td>
                        <td>
                            <a th:if="${emi.paymentStatus.name() != 'PAID'}" th:href="@{/borrower/pay/{id}(id=${emi.emiId})}" class="btn btn-sm btn-primary">Pay Now</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
