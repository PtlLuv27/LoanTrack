<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Officer Dashboard - LoanTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>🕵️‍♂️ Verification & Review Queue</h2>
        <div>
            <a th:href="@{/profile}" class="btn btn-secondary me-2">⚙️ Profile</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger">Logout</button>
            </form>
        </div>
    </div>
    
    <div th:if="${param.reviewed}" class="alert alert-success mt-3 shadow-sm">
        ✅ Application successfully verified and forwarded to Admin!
    </div>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card bg-warning text-dark shadow-sm border-0">
                <div class="card-body">
                    <h6 class="text-uppercase mb-1 fw-bold">Pending Reviews</h6>
                    <h3 class="mb-0" th:text="${#lists.size(applications)} + ' Applications'"></h3>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white fw-bold">
            Action Required
        </div>
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>App ID</th>
                        <th>Applicant Name</th>
                        <th>Amount Requested</th>
                        <th>Purpose</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="app : ${applications}">
                        <td class="fw-bold" th:text="${app.applicationId}"></td>
                        <td th:text="${app.user.fullName}"></td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(app.loanAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${app.loanPurpose}"></td>
                        <td><span class="badge bg-warning text-dark" th:text="${app.status}"></span></td>
                        <td>
                            <a th:href="@{/officer/application/{id}(id=${app.applicationId})}" class="btn btn-sm btn-primary px-3">Review & Verify</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(applications)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <h5>🎉 Inbox Zero!</h5>
                            <p class="mb-0">There are no pending applications at this time.</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
