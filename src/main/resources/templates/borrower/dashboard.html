<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Dashboard - LoanTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>👋 Welcome back, <span th:text="${userName}"></span></h2>
        <div>
            <a th:href="@{/profile}" class="btn btn-secondary me-2">⚙️ Profile</a>
            <a th:href="@{/borrower/credit-score}" class="btn btn-success me-2">📈 My Credit Score</a>
            <a th:href="@{/borrower/apply}" class="btn btn-primary me-2">Apply for New Loan</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-danger">Logout</button>
            </form>
        </div>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">Unauthorized access detected.</div>
    <div th:if="${param.applied}" class="alert alert-success">Your loan application was submitted successfully!</div>

    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">My Active Loans</h5>
        </div>
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Loan ID</th>
                        <th>Principal Amount</th>
                        <th>Interest Rate</th>
                        <th>Outstanding Balance</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="loan : ${loans}">
                        <td th:text="${loan.loanId}"></td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(loan.principalAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${loan.interestRate} + '%'"></td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(loan.outstandingBalance, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td><span class="badge bg-success" th:text="${loan.loanStatus}"></span></td>
                        <td>
                            <a th:href="@{/borrower/loan/{id}/schedule(id=${loan.loanId})}" class="btn btn-sm btn-info text-white">View EMI Schedule</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(loans)}">
                        <td colspan="6" class="text-center py-4">You have no active loans. Apply for one above!</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
